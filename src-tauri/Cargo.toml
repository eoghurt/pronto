[package]
name = "pronto"
version = "0.1.2"
description = "A PDF app that opens the file and gets out of the way"
edition = "2021"

[lib]
name = "pronto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
